server:
  port: 8080
spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: customer-service
          uri: http://localhost:8081
          predicates: [Path=/customers/**]
        - id: account-service
          uri: http://localhost:8082
          predicates: [Path=/accounts/**]
        - id: transaction-service
          uri: http://localhost:8083
          predicates: [Path=/transactions/**]
